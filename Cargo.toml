[workspace]
resolver = "2"
members = [
    "crates/kerf-span",
    "crates/kerf-syntax",
    "crates/kerf-core",
    "crates/kerf-reader",
    "crates/kerf-expander",
    "crates/kerf-compiler",
    "crates/kerf-runtime",
    "crates/kerf-vm",
    "crates/kerf-driver",
    "crates/kerf-backend",
]

# 根 crate（kerf）：承载跨 crate 集成测试（tests/v0/stage-N 树，sop.md §8.4.6 规则 3）
# 与 CLI 二进制入口（src/main.rs，编排 kerf-driver）。
[package]
name = "kerf"
version = "0.1.0"
edition = "2021"
description = "kerf — 最小自举系统级编程语言（Stage 0：语义验证，Rust 100% 实现）"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
kerf-span = { path = "crates/kerf-span" }
kerf-syntax = { path = "crates/kerf-syntax" }
kerf-core = { path = "crates/kerf-core" }
kerf-reader = { path = "crates/kerf-reader" }
kerf-expander = { path = "crates/kerf-expander" }
kerf-compiler = { path = "crates/kerf-compiler" }
kerf-runtime = { path = "crates/kerf-runtime" }
kerf-vm = { path = "crates/kerf-vm" }
kerf-driver = { path = "crates/kerf-driver" }
kerf-backend = { path = "crates/kerf-backend" }

# 零外部依赖（自举信任根显式化，§2.2 原则 11）：全部 10 个成员 crate 与根 crate
# 仅使用 Rust 标准库——构建可复现性优先于开发便利性（Stage 0 语义验证目标）。
# 注：kerf-backend 的 AOT 编排调用外部 qbe/cc 子进程（宿主工具链，
# 非 crate 依赖——§21.2 永不进入自举链的口径保持）。

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# 测试入口（sop.md §8.4.6 v11.2 测试入口架构意图）：跨 crate 集成测试经
# tests/runner.rs 单一总入口（cargo 自动发现）以 #[path] mod 树挂载
# v0/stage-N 全部测试文件——禁止 [[test]] 逐文件声明（清单精要原则）。

# 负向门审计集（sop.md §7.3.1 规则 3：examples/audit/ 可重运行，cargo 自动
# 发现不覆盖嵌套目录，显式声明）
[[example]]
name = "stage0_gate_audit_r1"
path = "examples/audit/stage0_gate_audit_r1.rs"

[[example]]
name = "stage1_gate_audit_r1"
path = "examples/audit/stage1_gate_audit_r1.rs"

[[example]]
name = "stage2_gate_audit_r1"
path = "examples/audit/stage2_gate_audit_r1.rs"

[[example]]
name = "stage2_gate_audit_r2"
path = "examples/audit/stage2_gate_audit_r2.rs"
